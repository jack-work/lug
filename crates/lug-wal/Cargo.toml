[package]
name = "lug-wal"
description = "Segmented write-ahead log: a file-backed lug-core Storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
crc32fast.workspace = true
lug-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustix = { version = "1", features = ["fs"] }

[features]
# Lets a test make a write fail partway through a batch, to prove the error
# path leaves nothing recoverable. Never on in a real build.
fault-injection = []

[dev-dependencies]
lug-wal = { path = ".", features = ["fault-injection"] }
tempfile = "3"
