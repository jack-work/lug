[workspace]
resolver = "3"
members = [
    "crates/cavlc",
    "crates/cavlc-demo",
    "crates/lug-core",
    "crates/lug-proto",
    "crates/lug-wal",
    "crates/lug-server",
    "crates/lug-client",
    "crates/lug-tui",
    "crates/lug-load",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cavlc = { path = "crates/cavlc" }
lug-core = { path = "crates/lug-core" }
lug-proto = { path = "crates/lug-proto" }
lug-wal = { path = "crates/lug-wal" }
lug-client = { path = "crates/lug-client" }

anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
bytes = { version = "1", features = ["serde"] }
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
toml = "0.9"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
