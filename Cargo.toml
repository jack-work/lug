[package]
name = "cavlc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Concurrent AVL control: immutable JSON snapshots and single-writer batches"

[workspace]
members = ["demo"]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
